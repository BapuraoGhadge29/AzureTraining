apiVersion: apps/v1
kind: Deployment
metadata:
  name: productapi

spec:
  replicas: 2

  selector:
    matchLabels:
      app: productapi

  template:
    metadata:
      labels:
        app: productapi

    spec:
      containers:

      - name: productapi

        image: bgzenacr.azurecr.io/productapi:v1

        ports:
          - containerPort: 8080